name: Android CI/CD - APK Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper
        cache-disabled: true

    - name: Build APK (Single Step)
      # Tüm parametreleri tek bir komutta topluyoruz
      run: ./gradlew clean assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mdm-device-info-apk
        path: app/build/outputs/apk/debug/app-debug.apk
