name: Android CI/CD - APK Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Cache özelliğini burada kapatıp gradle-build-action'a bırakıyoruz

    # Bu adım, gradlew dosyan bozuk olsa bile düzgün bir Gradle ortamı kurar
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Yetki hatası almamak için yine de bu kalsın
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Eğer ./gradlew hala hata verirse doğrudan 'gradle' komutunu kullanabilirsin
    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mdm-device-info-apk
        path: app/build/outputs/apk/debug/app-debug.apk
